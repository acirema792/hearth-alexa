<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hearth · Family</title>
<style>
  :root {
    --bg: #f6efe5; --panel: #fffaf3; --ink: #1d2540; --dim: #5a6178; --line: rgba(29,37,64,.12);
    --sage: #3f8a5c; --marigold: #b9850c; --rose: #c23f61; --night: #17203a;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 var(--sans); -webkit-font-smoothing: antialiased; }
  .wrap { padding: 18px 16px 90px; display: grid; gap: 14px; }
  .status { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); padding: 6px 6px 0; }
  h1 { font: 400 30px/1.05 var(--serif); margin: 4px 0 0; }
  .sub { color: var(--dim); }
  .today { background: var(--night); color: #f3e9dc; border-radius: 22px; padding: 16px; display: grid; gap: 10px; }
  .today .row { display: flex; align-items: center; gap: 10px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; border: 3px solid #c9bfb3; flex: none; }
  .dot.taken { background: #8fc1a0; border-color: #8fc1a0; }
  .dot.due { border-color: #f2c14e; }
  .dot.late, .dot.missed { border-color: #e46a86; background: rgba(228,106,134,.35); }
  .today .name { flex: 1; }
  .today .when { color: #c9bfb3; font-size: 13px; }
  .today .checkin { border-top: 1px solid rgba(243,233,220,.16); padding-top: 8px; color: #c9bfb3; font-size: 14px; }
  .today .checkin b { color: #f3e9dc; font-weight: 600; }
  h2 { font-size: 15px; margin: 6px 0 0; }
  .feed { display: grid; gap: 10px; }
  .note { background: var(--panel); border-radius: 18px; padding: 12px 14px; box-shadow: 0 1px 0 var(--line); display: grid; gap: 4px; border-left: 5px solid var(--line); }
  .note.attention, .note.urgent { border-left-color: var(--rose); }
  .note.info { border-left-color: var(--sage); }
  .note .t { font-weight: 650; display: flex; justify-content: space-between; gap: 8px; }
  .note .t span { font-weight: 400; color: var(--dim); font-size: 12px; white-space: nowrap; }
  .note .b { color: var(--dim); font-size: 14px; }
  .note .held { font-size: 12px; color: var(--marigold); }
  .note button, .compose button { justify-self: start; margin-top: 6px; min-height: 40px; padding: 0 16px; border-radius: 99px; border: 0; background: var(--ink); color: var(--bg); font: inherit; font-weight: 700; }
  .empty { color: var(--dim); }
  .compose { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 12px 14px; background: linear-gradient(transparent, var(--bg) 30%); display: flex; gap: 8px; }
  .compose input { flex: 1; min-width: 0; min-height: 44px; border-radius: 99px; border: 2px solid var(--line); background: #fff; padding: 0 16px; font: inherit; }
  .compose button { margin: 0; }
  .banner { position: fixed; left: 8px; right: 8px; top: 8px; background: rgba(255,255,255,.96); border-radius: 18px; padding: 12px 14px; box-shadow: 0 12px 30px -10px rgba(0,0,0,.35); transform: translateY(-140%); transition: transform .45s cubic-bezier(.2,.9,.3,1.2); z-index: 5; display: grid; gap: 2px; }
  .banner.show { transform: none; }
  .banner .app { font-size: 11px; color: var(--dim); display: flex; gap: 6px; align-items: center; }
  .banner .app i { width: 14px; height: 14px; border-radius: 4px; background: var(--marigold); display: inline-block; }
  .banner .t { font-weight: 700; }
  .banner .b { font-size: 14px; color: var(--dim); }
  @media (prefers-reduced-motion: reduce) { .banner { transition: none; } }
</style>
</head>
<body>
<div class="banner" id="banner" role="status" aria-live="assertive"><div class="app"><i></i>Hearth · now</div><div class="t" id="b-t"></div><div class="b" id="b-b"></div></div>
<div class="status"><span id="clock"></span><span>Daniel's phone</span></div>
<main class="wrap" id="app"><p class="empty">Connecting to Hearth…</p></main>
<form class="compose" id="compose" autocomplete="off">
  <input id="msg" placeholder="Send Mom a note" aria-label="Note for Mom" maxlength="200">
  <button type="submit">Send</button>
</form>
<script>
  const $ = (s) => document.querySelector(s);
  let seen = null;
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const ago = (iso, now) => { const m = Math.round((now - new Date(iso)) / 60000); return m < 1 ? "now" : m < 60 ? `${m}m` : m < 1440 ? `${Math.round(m / 60)}h` : `${Math.round(m / 1440)}d`; };

  async function load() {
    const s = await (await fetch("/api/state")).json();
    const now = new Date(s.clock.now);
    $("#clock").textContent = new Intl.DateTimeFormat("en-US", { hour: "numeric", minute: "2-digit", timeZone: "America/Los_Angeles" }).format(now);
    const t = s.today, w = s.weekly;
    const quotes = Object.fromEntries(w.openQuotes.map((q) => [q.medId, q]));
    $("#app").innerHTML = `
      <div><h1>Mom today</h1><div class="sub">${esc(t.takenCount)} of ${esc(t.totalCount)} doses · ${w.adherencePct}% this week · ${t.nowLabel} her time</div></div>
      <section class="today">
        ${t.doses.map((d) => `<div class="row"><span class="dot ${d.status}"></span><span class="name">${esc(d.name)} <span class="when">${d.timeLabel}</span></span><span class="when">${d.status === "taken" ? "✓ " + esc(d.loggedAtLabel) : d.status}</span></div>`).join("")}
        <div class="checkin">${t.checkIn ? `Check-in: feeling <b>${esc(t.checkIn.mood)}</b>, slept <b>${esc(t.checkIn.sleep)}</b>, pain <b>${esc(t.checkIn.pain)}</b>${t.checkIn.note ? ` · “${esc(t.checkIn.note)}”` : ""}` : "No check-in yet today"}</div>
      </section>
      <h2>From Hearth</h2>
      <section class="feed">${s.notifications.length ? s.notifications.map((n) => {
        const medId = (n.reason.match(/^refill:([a-z]+):/) || [])[1];
        const q = medId && quotes[medId];
        return `<article class="note ${n.severity}"><div class="t">${esc(n.title)}<span>${ago(n.at, now)}</span></div><div class="b">${esc(n.body)}</div>${n.delivered === "held_quiet_hours" ? `<div class="held">Held during your quiet hours</div>` : ""}${q ? `<button data-token="${q.token}">Confirm $${q.copay.toFixed(2)} refill</button>` : ""}</article>`;
      }).join("") : `<p class="empty">Nothing needs you. Hearth will tell you if it does.</p>`}</section>`;
    document.querySelectorAll("button[data-token]").forEach((b) => (b.onclick = async () => {
      b.disabled = true; b.textContent = "Ordering…";
      await fetch("/api/confirm-refill", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ token: b.dataset.token, confirmedBy: "daniel" }) });
      load();
    }));
    const newest = s.notifications[0];
    if (seen !== null && newest && newest.id !== seen) banner(newest);
    seen = newest ? newest.id : "";
  }

  function banner(n) {
    $("#b-t").textContent = n.title;
    $("#b-b").textContent = n.body;
    const b = $("#banner");
    b.classList.add("show");
    clearTimeout(banner.t);
    banner.t = setTimeout(() => b.classList.remove("show"), 5200);
  }

  $("#compose").addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = $("#msg").value.trim();
    if (!text) return;
    $("#msg").value = "";
    await fetch("/api/message", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ from: "daniel", to: "rosa", text }) });
  });

  let timer;
  const es = new EventSource("/events");
  es.addEventListener("change", () => { clearTimeout(timer); timer = setTimeout(load, 150); });
  load();
  setInterval(load, 30000);
  window.hearthCompanion = { send: (text) => fetch("/api/message", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ from: "daniel", to: "rosa", text }) }) };
</script>
</body>
</html>
